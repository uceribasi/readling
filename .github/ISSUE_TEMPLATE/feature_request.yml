name: Feature request
description: An idea to make readling better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to do and why it's hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could readling help?
      description: Your idea for how it could work. Rough is fine.
