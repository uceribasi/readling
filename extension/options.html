<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>readling extension options</title>
    <style>
      body { font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; max-width: 34rem; margin: 2rem auto; padding: 0 1rem; color: #1c1917; }
      h1 { font-size: 1.25rem; }
      label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
      input { width: 100%; box-sizing: border-box; padding: 0.5rem 0.75rem; border: 1px solid #d6d3d1; border-radius: 0.5rem; font: inherit; }
      button { margin-top: 0.75rem; padding: 0.5rem 1rem; border: 0; border-radius: 0.5rem; background: #4f46e5; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      p.note { color: #78716c; font-size: 0.85rem; }
      #status { margin-left: 0.5rem; color: #047857; }
      #status.error { color: #b91c1c; }
      @media (prefers-color-scheme: dark) {
        body { background: #0c0a09; color: #e7e5e4; }
        input { background: #1c1917; color: inherit; border-color: #44403c; }
      }
    </style>
  </head>
  <body>
    <h1>readling</h1>
    <form id="form">
      <label for="app-url">Address of your readling</label>
      <input id="app-url" type="url" required placeholder="http://localhost:5173/" />
      <p class="note">
        Where readling runs for you, for example <code>http://localhost:5173/</code> while developing, or the address you host
        it at. The extension opens pages there; your texts stay in that browser profile.
      </p>
      <button type="submit">Save</button><span id="status" role="status"></span>
    </form>
    <script src="options.js"></script>
  </body>
</html>
